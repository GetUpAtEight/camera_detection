server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 2KB

spring:
  application:
    name: camera-tamper-backend
  servlet:
    multipart:
      # 低频巡检一次抽样最多 12 帧；按 4K JPEG 单帧 8MB 估算留余量
      max-file-size: 16MB
      max-request-size: 32MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

app:
  auth:
    # 访问令牌。留空 = 不鉴权（fail-open，启动后首请求打一条 WARN）。
    # 部署前必须配置：环境变量 APP_AUTH_TOKEN 可直接覆盖本值，优先级更高。
    #   调用方携带 Authorization: Bearer <token> 或 X-API-Token: <token>，二者等价。
    token: ${APP_AUTH_TOKEN:}

  algo:
    # 算法层地址。
    #   本地模式：http://127.0.0.1:8000
    #   GPU 隧道：http://127.0.0.1:18010
    # 启动脚本会按模式设置环境变量 APP_ALGO_BASEURL 覆盖本值，
    # 手动启动时也可自行指定。
    base-url: http://127.0.0.1:8000
    connect-timeout-ms: 5000
    # 一次抽样要跑三层信号 + 参照物匹配（CPU 约 0.2~2 秒），给足余量
    read-timeout-ms: 120000

logging:
  level:
    com.demo.tamper: INFO
    org.springframework.web: WARN