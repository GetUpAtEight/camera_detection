server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/csv,text/plain
    min-response-size: 2KB

spring:
  application:
    name: camera-tamper-backend
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 1024MB
  datasource:
    # 演示环境用 H2 文件库，开箱即用；生产可替换为 MySQL（见文件末尾注释）
    url: jdbc:h2:file:./data/ctd;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

app:
  algo:
    # Python 算法层地址。
    # GPU 服务器（125.122.133.73）的 8010 只监听 127.0.0.1，通过 deploy/remote.py 起的
    # SSH 隧道映射到本地 18010；本机开发时可直接写 http://127.0.0.1:8000。
    base-url: http://127.0.0.1:18010
    connect-timeout-ms: 5000
    # 视频是要等算法层整段跑完才返回，读超时需要给足（分段扫描会跑多段，给 60 分钟）
    read-timeout-ms: 3600000
    poll-interval-ms: 800
    max-poll-minutes: 90
  storage:
    upload-dir: ./data/uploads
    visual-dir: ./data/visuals
    max-file-size-mb: 512
  detection:
    sample-fps: 5
    max-frames: 600
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 50

logging:
  level:
    com.demo.tamper: INFO

